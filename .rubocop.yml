AllCops:
  Exclude:
    - "spec/**/*"
    - "vendor/**/*"
  TargetRubyVersion: 3.0
  SuggestExtensions: false
  NewCops: enable

Layout:
  Enabled: false

Metrics:
  Enabled: false

Style:
  Enabled: false

Naming:
  Enabled: false

Layout/EndAlignment:
  Enabled: false

Style/StringLiterals:
  Enabled: true
  EnforcedStyle: double_quotes
